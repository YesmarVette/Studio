<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="images/Untitled.png" />
  <title>Gallery</title>
  <style>
    :root {
      --frost: rgba(255, 255, 255, 0.06);
      --highlight: #a8d8f0;
      --text: #f0f0f0;
      --ice-border: rgba(168, 216, 240, 0.25);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      color: var(--text);
      overflow-x: hidden;
      background: #000;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #0d1117;
      z-index: 0;
    }

    .sidebar {
      width: 120px;
      background: var(--frost);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      gap: 30px;
      position: fixed;
      height: 100vh;
      border-right: 1px solid var(--ice-border);
      z-index: 2;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
      border: 1px solid var(--ice-border);
    }

    .sidebar a:hover {
      background-color: rgba(255, 255, 255, 0.1);
      transform: scale(1.1);
      color: var(--highlight);
    }

    .main {
      margin-left: 140px;
      padding: 40px;
      z-index: 1;
      position: relative;
    }

    h1 { font-size: 36px; }
    p { color: var(--highlight); font-weight: 500; }

    .form-box {
      background: var(--frost);
      backdrop-filter: blur(20px);
      border: 1px solid var(--ice-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .poster-form {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .form-left, .form-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 250px;
    }

    input, textarea {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--ice-border);
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .image-preview {
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--ice-border);
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #ccc;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: rgba(168, 216, 240, 0.2);
      color: white;
      font-weight: bold;
      border-radius: 12px;
      border: 1px solid rgba(168, 216, 240, 0.4);
      cursor: pointer;
    }

    .posterboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .post-wrapper {
      position: relative;
    }

    .hover-body {
      display: none;
      position: absolute;
      top: 0;
      left: 105%;
      width: 200px;
      background: var(--frost);
      backdrop-filter: blur(10px);
      border: 1px solid var(--ice-border);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 10px #a8d8f055;
      color: var(--text);
      z-index: 10;
    }

    .post-wrapper:hover .hover-body {
      display: block;
    }

    .post-card {
      background: var(--frost);
      backdrop-filter: blur(20px);
      border: 1px solid var(--ice-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      color: inherit;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .post-card:hover {
      transform: scale(1.03);
    }

    .post-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .post-card h3 {
      margin: 0 0 6px;
      font-size: 18px;
      color: var(--highlight);
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <div class="sidebar">
    <a href="index.html" title="Home">🏠</a>
    <a href="page3.html" title="Downloads">⬇️</a>
    <a href="page4.html" title="Art">🎨</a>
    <a href="https://www.youtube.com/@00GOON-00" title="YouTube">▶️</a>
    <a href="page6.html" title="News">📰</a>
    <a href="page7.html" title="Chat">💬</a>
  </div>

  <div class="main">
    <h1>Gallery</h1>
    <p>Post music, art, videos, links and more</p>

    <div class="form-box">
      <form class="poster-form" onsubmit="submitPost(); return false;">
        <div class="form-left">
          <input type="text" id="titleInput" placeholder="Title">
          <input type="text" id="linkInput" placeholder="Link (e.g. https://...)">
          <textarea id="bodyInput" placeholder="Body text..."></textarea>
        </div>
        <div class="form-right">
          <input type="text" id="imageInput" placeholder="Image URL">
          <div class="image-preview" id="imagePreview">🖼️ Image preview</div>
          <button type="submit">Post</button>
        </div>
      </form>
    </div>

    <div class="posterboard" id="posterboard"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyARnUbXOe1iReI2ml4_f2qvnv_6wn6W-N0",
      authDomain: "posterboar.firebaseapp.com",
      databaseURL: "https://posterboar-default-rtdb.firebaseio.com",
      projectId: "posterboar",
      storageBucket: "posterboar.firebasestorage.app",
      messagingSenderId: "646027769829",
      appId: "1:646027769829:web:f85522789d22c0720d610c",
      measurementId: "G-53QS1E4CMD"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function submitPost() {
      const title = document.getElementById('titleInput').value.trim();
      const image = document.getElementById('imageInput').value.trim();
      const link = document.getElementById('linkInput').value.trim();
      const body = document.getElementById('bodyInput').value.trim();
      if (!title || !image || !link) return alert("Fill in all required fields!");

      db.ref("posts").push({ title, image, link, body });

      document.getElementById('titleInput').value = '';
      document.getElementById('imageInput').value = '';
      document.getElementById('linkInput').value = '';
      document.getElementById('bodyInput').value = '';
      document.getElementById('imagePreview').innerHTML = '🖼️ Image preview';
    }

    function createCard(post) {
      return `
        <div class="post-wrapper">
          <a class="post-card" href="${post.link}" target="_blank">
            <img src="${post.image}" alt="Post image">
            <h3>${post.title}</h3>
          </a>
          <div class="hover-body">
            <p>${post.body || 'No description.'}</p>
          </div>
        </div>
      `;
    }

    const board = document.getElementById("posterboard");
    db.ref("posts").on("child_added", snapshot => {
      const post = snapshot.val();
      board.innerHTML += createCard(post);
    });

    document.getElementById('imageInput').addEventListener('input', function() {
      const url = this.value.trim();
      const preview = document.getElementById('imagePreview');
      if (url) {
        preview.innerHTML = `<img src="${url}" alt="Preview">`;
      } else {
        preview.innerHTML = '🖼️ Image preview';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 75 },
        color: { value: "#a8d8f0" },
        shape: { type: "circle" },
        opacity: { value: 0.5 },
        size: { value: 2.5, random: true },
        line_linked: {
          enable: true,
          distance: 130,
          color: "#a8d8f0",
          opacity: 0.35,
          width: 1
        },
        move: {
          enable: true,
          speed: 0.8,
          direction: "none",
          out_mode: "bounce"
        }
      },
      interactivity: {
        events: {
          onhover: { enable: true, mode: "grab" }
        },
        modes: {
          grab: {
            distance: 150,
            line_linked: { opacity: 0.45 }
          }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
